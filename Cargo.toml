[package]
name = "doodoro"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
lyon = "1.0"
serde_json = "1.0.154"

[build-dependencies]
cc = "1.10.0"

# The same size settings as the Tauri port, so the two binaries compare fairly.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
